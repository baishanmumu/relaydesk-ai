<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">RelayDesk AI request flow</title>
  <desc id="desc">Requests pass guardrails, route to specialist agents, retrieve policy context, and pause for approval before sensitive actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e7d83"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173047" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#f4f7f4"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="52" y="53" fill="#506778" font-size="13" font-weight="700" letter-spacing="2">REQUEST LIFECYCLE</text>
    <g filter="url(#shadow)">
      <rect x="52" y="202" width="156" height="92" rx="15" fill="#fff" stroke="#d8e2de"/>
      <rect x="254" y="202" width="176" height="92" rx="15" fill="#e6f1eb" stroke="#bdd8c8"/>
      <rect x="486" y="94" width="196" height="92" rx="15" fill="#fff" stroke="#d8e2de"/>
      <rect x="486" y="202" width="196" height="92" rx="15" fill="#fff" stroke="#d8e2de"/>
      <rect x="486" y="310" width="196" height="92" rx="15" fill="#fff" stroke="#d8e2de"/>
      <rect x="754" y="202" width="174" height="92" rx="15" fill="#f1eddc" stroke="#e1d7ad"/>
      <rect x="1000" y="202" width="148" height="92" rx="15" fill="#263e50"/>
      <rect x="754" y="372" width="174" height="72" rx="15" fill="#d9eee7" stroke="#b8ddd0"/>
    </g>
    <g fill="#203548" font-size="17" font-weight="700" text-anchor="middle">
      <text x="130" y="239">用户请求</text><text x="342" y="239">安全与范围检查</text>
      <text x="584" y="131">旅行专员</text><text x="584" y="239">电商与订单</text><text x="584" y="347">知识与表单</text>
      <text x="841" y="239">敏感操作？</text><text x="841" y="414">等待用户确认</text>
      <text x="1074" y="239" fill="#f5f8f6">统一回复</text>
    </g>
    <g fill="#6a7f8a" font-size="12" text-anchor="middle">
      <text x="130" y="263">Web / CLI</text><text x="342" y="263">越狱与相关性</text>
      <text x="584" y="156">航班 · 酒店 · 租车 · 行程</text>
      <text x="584" y="264">商品检索 · 订单查询</text>
      <text x="584" y="372">RAG · FAQ · 表单提交</text>
      <text x="841" y="263">写入或提交动作</text>
      <text x="841" y="430">确认后继续执行</text>
      <text x="1074" y="263" fill="#cbd6dc">记录工具结果</text>
    </g>
    <g fill="none" stroke="#5e7d83" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M208 248H249"/><path d="M430 248H466V140H480"/><path d="M430 248H480"/><path d="M430 248H466V356H480"/>
      <path d="M682 140H725V220H748"/><path d="M682 248H748"/><path d="M682 356H725V276H748"/>
      <path d="M928 248H994"/><path d="M841 294V366"/><path d="M928 408H967V284H994"/>
    </g>
    <path d="M584 402V458H966V284" fill="none" stroke="#b4c1bd" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <text x="602" y="483" fill="#70858c" font-size="12">只在被允许且必要时调用外部业务 API</text>
  </g>
</svg>
