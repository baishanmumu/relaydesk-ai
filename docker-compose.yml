services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  relaydesk:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      QDRANT_URL: http://qdrant:6333
      SQLITE_DB_PATH: /app/data/travel2.sqlite
      DEMO_PASSENGER_ID: ${DEMO_PASSENGER_ID:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./user_data:/app/user_data
      - ./data:/app/data
      - ./faq_documents:/app/faq_documents:ro
    depends_on:
      - qdrant

volumes:
  qdrant-data:
